# Render Blueprint (optional alternative to Dashboard UI)
# Docs: https://render.com/docs/blueprint-spec
# Link this repo in Render → New → Blueprint
services:
  - type: web
    name: chat-primary-service
    runtime: node
    plan: free # change to starter/standard for production
    rootDir: primary-service
    buildCommand: npm ci --omit=dev
    startCommand: node src/server.js
    healthCheckPath: /api/v1/health
    autoDeploy: true # Render also deploys on push if connected; GHA hook is optional
    envVars:
      - key: NODE_ENV
        value: production
      - key: APP_ENV
        value: production
      - key: APP_PORT
        value: 3000
      - key: APP_NAME
        value: ChatPrimaryService
      - key: APP_VERSION
        value: 1.0.0
      - key: JWT_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: JWT_ADMIN_SECRET
        sync: false
      - key: JWT_ADMIN_REFRESH_SECRET
        sync: false
      - key: JWT_EXPIRY
        value: 15m
      - key: JWT_REFRESH_EXPIRY
        value: 7d
      - key: JWT_ADMIN_EXPIRY
        value: 15m
      - key: JWT_ADMIN_REFRESH_EXPIRY
        value: 7d
      - key: MYSQL_HOST
        sync: false
      - key: MYSQL_PORT
        value: 3306
      - key: MYSQL_DATABASE
        sync: false
      - key: MYSQL_USERNAME
        sync: false
      - key: MYSQL_PASSWORD
        sync: false
      - key: MYSQL_CONNECTION_LIMIT
        value: 20
      - key: REDIS_HOST
        sync: false
      - key: REDIS_PORT
        value: 6379
      - key: REDIS_PASSWORD
        sync: false
      - key: REDIS_REQUIRED
        value: "false"
      - key: CORS_ORIGIN
        sync: false
      - key: SOCKET_CORS_ORIGIN
        sync: false
      - key: BCRYPT_SALT_ROUNDS
        value: 12
      - key: LOG_LEVEL
        value: info
      - key: AWS_REGION
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_S3_BUCKET
        sync: false
