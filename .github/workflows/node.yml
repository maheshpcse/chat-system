# =============================================================================
# Node.js Backend CI/CD — chat-system (primary-service → Render)
# Repo: https://github.com/maheshpcse/chat-system
# Path in monorepo: primary-service/
# Deploy: Render Blueprint / Deploy Hook (GitHub Secrets)
# =============================================================================
name: Node CI/CD

on:
  push:
    branches: [main]
    paths:
      - "primary-service/**"
      - ".github/workflows/node.yml"
      - "docker-compose.yml"
  pull_request:
    branches: [main]
    paths:
      - "primary-service/**"
      - ".github/workflows/node.yml"
  workflow_dispatch:

concurrency:
  group: node-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: primary-service

env:
  NODE_ENV: test

jobs:
  # ---------------------------------------------------------------------------
  # Job 1: Install → Lint → Test → Docker build smoke
  # ---------------------------------------------------------------------------
  build:
    name: Lint, Test & Package
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      # Cache npm for primary-service lockfile only
      - name: Cache npm packages
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-primary-npm-${{ hashFiles('primary-service/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-primary-npm-

      - name: Install dependencies
        run: npm ci

      # ESLint over src/ — fails workflow on lint errors
      - name: Run lint
        run: npm run lint
        continue-on-error: false

      # Jest unit/integration tests with coverage
      - name: Run tests
        run: npm test
        env:
          APP_ENV: test
          JWT_SECRET: ci-test-jwt-secret-min-32-chars-long!!
          JWT_REFRESH_SECRET: ci-test-refresh-secret-min-32-chars!
          JWT_ADMIN_SECRET: ci-test-admin-jwt-secret-min-32!!
          JWT_ADMIN_REFRESH_SECRET: ci-test-admin-refresh-secret-32!
          MYSQL_HOST: 127.0.0.1
          MYSQL_PORT: "3306"
          MYSQL_DATABASE: chat_system_test
          MYSQL_USERNAME: root
          MYSQL_PASSWORD: ""
          REDIS_REQUIRED: "false"

      # Pure JS service — no tsc step. Verify entry file exists.
      - name: Verify runtime entrypoint
        run: |
          test -f src/server.js
          test -f src/app.js
          node -e "require('./src/app'); console.log('app module loads')"

      # Optional: build Docker image to catch Dockerfile regressions (no push)
      - name: Docker build smoke test
        if: github.event_name != 'pull_request' || true
        working-directory: .
        run: |
          docker build -t chat-primary-service:ci -f primary-service/Dockerfile primary-service

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-primary
          path: primary-service/coverage
          if-no-files-found: ignore
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Job 2: Deploy to Render via Deploy Hook
  # ---------------------------------------------------------------------------
  deploy:
    name: Deploy to Render
    needs: build
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Deploy only curls Render; no checkout. Override workflow default
    # working-directory (primary-service) so the job does not fail before start.
    defaults:
      run:
        working-directory: ${{ github.workspace }}
    environment:
      name: production
      url: ${{ vars.RENDER_SERVICE_URL }}

    steps:
      - name: Trigger Render deploy hook
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "::error::Secret RENDER_DEPLOY_HOOK_URL is not set."
            echo "Create a Render Web Service, open Settings → Deploy Hook, copy URL,"
            echo "then add it as a repository secret named RENDER_DEPLOY_HOOK_URL."
            exit 1
          fi
          echo "Triggering Render deploy for commit ${{ github.sha }}..."
          HTTP_CODE=$(curl -sS -o /tmp/render-response.txt -w "%{http_code}" \
            -X POST "$RENDER_DEPLOY_HOOK_URL")
          cat /tmp/render-response.txt || true
          echo ""
          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
            echo "::error::Render deploy hook failed with HTTP $HTTP_CODE"
            exit 1
          fi
          echo "Render accepted deploy request (HTTP $HTTP_CODE)."

      - name: Post-deploy health check (optional)
        env:
          RENDER_SERVICE_URL: ${{ secrets.RENDER_SERVICE_URL }}
        run: |
          if [ -z "$RENDER_SERVICE_URL" ]; then
            echo "RENDER_SERVICE_URL secret not set — skipping live health probe."
            echo "Set it to e.g. https://your-service.onrender.com"
            exit 0
          fi
          # Render builds take time; poll readiness for up to ~5 minutes
          URL="${RENDER_SERVICE_URL%/}/api/v1/health"
          echo "Probing $URL ..."
          for i in $(seq 1 30); do
            if curl -fsS "$URL" | tee /tmp/health.json; then
              echo "Health OK"
              exit 0
            fi
            echo "Attempt $i failed — waiting 10s..."
            sleep 10
          done
          echo "::warning::Health check did not pass within timeout (deploy may still be building)."
          exit 0

  notify:
    name: Workflow summary
    needs: [build, deploy]
    if: always()
    runs-on: ubuntu-latest
    # Summary job has no checkout; do not inherit primary-service cwd.
    defaults:
      run:
        working-directory: ${{ github.workspace }}
    steps:
      - name: Write job summary
        run: |
          echo "## Node CI/CD result" >> $GITHUB_STEP_SUMMARY
          echo "- Build: \`${{ needs.build.result }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- Deploy: \`${{ needs.deploy.result }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- Commit: \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
